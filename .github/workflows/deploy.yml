name: Hexo Build and Deploy

on:
  push:
    branches:
      - main  # 监听 main 分支的推送

# 🌟 新增：赋予工作流写入仓库的权限
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 步骤 1: 检出代码
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 步骤 2: 设置 Node.js 环境（Hexo 基于 Node.js）
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'  # 推荐使用 Node.js 18+（Hexo 6+ 要求）

      # 步骤 3: 缓存 node_modules 加速构建
      - name: Cache Dependencies
        uses: actions/cache@v3
        id: cache
        with:
          path: |
            node_modules
            public
            .cache
          key: ${{ runner.os }}-hexo-${{ hashFiles('package-lock.json') }}

      # 步骤 4: 安装 Hexo 及其依赖
      - name: Install Dependencies
        run: |
          npm install -g hexo-cli  # 全局安装 Hexo CLI
          npm install  # 安装项目依赖（根据你的 package.json）

      # 步骤 5: 生成静态文件
      - name: Build Hexo
        run: |
          hexo clean  # 清理旧文件
          hexo generate  # 生成静态文件到 public 目录

      # 步骤 6: 部署到 GitHub Pages 分支
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: main # 🌟 修改：目标分支改为了 main
          folder: public
